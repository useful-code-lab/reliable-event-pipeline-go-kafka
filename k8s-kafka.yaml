apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-deployment
  labels:
    app: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: apache/kafka:3.7.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_NODE_ID
          value: "1"
        - name: KAFKA_PROCESS_ROLES
          value: "broker,controller"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "1@localhost:9093"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://kafka-service:9092"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "CONTROLLER"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
spec:
  selector:
    app: kafka
  ports:
    - protocol: TCP
      port: 9092
      targetPort: 9092
---
# ИНФРАСТРУКТУРА: PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "user"
        - name: POSTGRES_PASSWORD
          value: "password"
        - name: POSTGRES_DB
          value: "app_db"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
---
# ИНФРАСТРУКТУРА: Redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  selector:
    app: redis
  ports:
  - port: 6379
---
# НАШЕ GO-ПРИЛОЖЕНИЕ
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-kafka-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-kafka-app
  template:
    metadata:
      labels:
        app: go-kafka-app
    spec:
      # Ждем готовности всех инфраструктурных сервисов перед стартом
      initContainers:
      - name: wait-for-infra
        image: busybox:latest
        command: ['sh', '-c', 'until nc -zvw1 kafka-service 9092 && nc -zvw1 postgres-service 5432 && nc -zvw1 redis-service 6379; do echo "Ожидание запуска инфраструктуры..."; sleep 2; done;']
      
      containers:
      - name: app
        image: kafka-pipeline-go:local
        imagePullPolicy: Never
        env:
        - name: KAFKA_BROKERS
          value: "kafka-service:9092"
        - name: KAFKA_TOPIC
          value: "local-events"
        - name: KAFKA_DLQ_TOPIC
          value: "local-events-dlq"
        - name: KAFKA_GROUP_ID
          value: "local-processor-group"
        - name: DATABASE_URL
          value: "postgres://user:password@postgres-service:5432/app_db?sslmode=disable"
        - name: REDIS_URL
          value: "redis-service:6379"
